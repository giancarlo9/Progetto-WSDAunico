<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registra Cliente</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container-fluid login-container home">
      <h3 class="text-center">Registra un nuovo cliente</h3>
      <form id="clienteForm" class="mt-4">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="text"
            id="nome"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="cognome" class="form-label">Cognome</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="text"
            id="cognome"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="indirizzo" class="form-label">Indirizzo</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="text"
            id="indirizzo"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">Telefono</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="number"
            id="telefono"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="email"
            id="email"
            class="form-control"
            required
          />
        </div>
        <button type="submit" class="accettazione-button">
          <i class="bi bi-person-fill-add"></i>
          Registra Cliente
        </button>
        <button
          onclick="location.href='../accettazione-dashboard.html'"
          class="second-button"
        >
          <i class="bi bi-arrow-left-circle-fill"></i> Torna alla Dashboard
        </button>
      </form>
      <div id="responseMessage" class="mt-3"></div>
    </div>

    <script src="registra-cliente.js"></script>
  </body>
</html>
