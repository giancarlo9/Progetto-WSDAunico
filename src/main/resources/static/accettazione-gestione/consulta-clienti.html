<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta Clienti</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container-fluid home text-center">
      <h3>Clienti Registrati</h3>
      <table id="clientTable" class="table table-striped">
        <thead>
          <tr class="text-white">
            <th><i class="bi bi-upc"></i> ID</th>
            <th><i class="bi bi-person-circle"></i> Nome</th>
            <th><i class="bi bi-person-circle"></i> Cognome</th>
            <th><i class="bi bi-geo-alt-fill"></i> Indirizzo</th>
            <th><i class="bi bi-telephone-fill"></i> Telefono</th>
            <th><i class="bi bi-envelope-at-fill"></i> Email</th>
            <th><i class="bi bi-car-front-fill"></i> Veicoli</th>
          </tr>
        </thead>
        <tbody>
          <!-- I dati verranno aggiunti dinamicamente qui -->
        </tbody>
      </table>
      <button
        onclick="location.href='../accettazione-dashboard.html'"
        class="second-button"
      >
        <i class="bi bi-arrow-left-circle-fill me-2"></i>Torna alla Dashboard
      </button>
    </div>

    <script src="consulta-clienti.js"></script>
  </body>
</html>
