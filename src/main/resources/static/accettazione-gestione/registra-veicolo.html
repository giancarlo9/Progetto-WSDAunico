<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registra Veicolo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container-fluid login-container home">
      <h3 class="text-center">Registra un nuovo veicolo</h3>
      <form id="clienteForm" class="mt-4">
        <div class="mb-3">
          <label for="targa" class="form-label">Targa</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="text"
            id="targa"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="marca" class="form-label">Marca</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="text"
            id="marca"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="modello" class="form-label">Modello</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="text"
            id="modello"
            class="form-control"
            required
          />
        </div>
        <div class="mb-3">
          <label for="anno" class="form-label">Anno</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="number"
            id="anno"
            class="form-control"
            required
          />
        </div>

        <div class="mb-3">
          <label for="idCliente" class="form-label">ID Cliente</label>
          <input
            class="custom-input"
            style="width: 100%"
            type="number"
            id="idCliente"
            class="form-control"
            required
          />
        </div>
        <button type="submit" class="accettazione-button">
          <i class="bi bi-car-front-fill"></i>
          Registra Veicolo
        </button>
        <button
          onclick="location.href='../accettazione-dashboard.html'"
          class="second-button"
        >
          <i class="bi bi-arrow-left-circle-fill"></i> Torna alla Dashboard
        </button>
      </form>
      <div id="responseMessage" class="mt-3"></div>
    </div>

    <script src="registra-veicolo.js"></script>
  </body>
</html>
