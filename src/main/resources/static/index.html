<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="home container-fluid">
      <div class="row myrow">
        <h3 class="text-center">Benvenuto nel portale dell' OFFICINA WSDA!</h3>
        <div class="col-4">
          <img
            src="./assets/logo (2).jpeg"
            alt="logo"
            style="width: 250px; height: auto"
          />
        </div>
        <div class="col-8 stato">
          <h6 class="mt-1">
            Consulta lo stato della tua riparazione inserendo i dati presenti
            sulla ricevuta che ti abbiamo consegnato il giorno in cui ci hai
            lasciato la moto!
          </h6>

          <form id="stateForm" class="d-flex">
            <div class="m-2">
              <label for="codiceServizio">Codice Servizio</label>
              <input
                class="custom-input"
                type="text"
                id="codiceServizio"
                placeholder="SERV-123"
              />
            </div>
            <div class="m-2">
              <label for="targa">Targa</label>
              <input
                class="custom-input"
                type="text"
                id="targa"
                placeholder="AA123BB"
              />
            </div>

            <button type="submit" class="custom-button m-2">
              <i class="bi bi-clipboard-check"></i>
              Controlla
            </button>
          </form>
        </div>
        <div class="col-4 mt-2 login-container">
          <h6>AREA RISERVATA DIPENDENTI</h6>
          <form id="loginForm">
            <div class="m-2">
              <label for="email">Email</label> <br />
              <input
                class="custom-input"
                type="email"
                id="email"
                placeholder="Inserisci qui la tua email"
              />
            </div>
            <div class="m-2">
              <label for="password">Password</label><br />
              <input
                class="custom-input"
                type="password"
                id="password"
                placeholder="Inserisci qui la tua password"
              />
            </div>
            <p id="error-message" class="text-danger"></p>
            <button type="submit" class="custom-button ms-5">
              <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
            </button>
            <div>
              <p class="m-0 crea">Crea un account con l' e-mail aziendale</p>
            </div>
            <div>
              <a href="./Registrazione.html" class="linknondecorato"
                >Registrati</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
