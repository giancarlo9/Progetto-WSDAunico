<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrazione</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="home container-fluid">
      <div class="row myrow">
        <h3 class="text-center">
          Effettua la registrazione usando l'e-mail aziendale!
        </h3>
        <div class="col-4">
          <img
            src="./assets/logo (2).jpeg"
            alt="logo"
            style="width: 250px; height: auto"
          />
        </div>

        <div class="col-4 mt-2 login-container">
          <div id="success-message" class="text-success text-center"></div>
          <form id="registrationForm" class="mt-4">
            <div id="error-message" class="text-danger text-center"></div>

            <div class="m-2 text-center">
              Inserisci qui i tuoi dati per registrarti!
            </div>

            <div class="mb-3">
              <input
                class="custom-input"
                style="width: 100%"
                type="text"
                id="username"
                class="form-control"
                placeholder="Username"
              />
            </div>

            <div class="mb-3">
              <input
                class="custom-input"
                style="width: 100%"
                type="email"
                id="email"
                class="form-control"
                placeholder="Email"
              />
            </div>

            <div class="mb-3">
              <select
                class="custom-input"
                style="width: 100%"
                id="role"
                class="form-select"
              >
                <option value="">Ruolo</option>
                <option value="ACCETTAZIONE">Accettazione</option>
                <option value="MECCANICO">Meccanico</option>
                <option value="MAGAZZINIERE">Magazziniere</option>
                <option value="CASSIERE">Cassiere</option>
              </select>
            </div>

            <div class="mb-3">
              <input
                class="custom-input"
                style="width: 100%"
                type="password"
                id="password"
                class="form-control"
                placeholder="Password"
              />
            </div>

            <div class="mb-3">
              <input
                class="custom-input"
                style="width: 100%"
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Conferma Password"
              />
            </div>

            <button type="submit" class="custom-button" style="width: 100%">
              Crea il mio account
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="registrazione.js"></script>
  </body>
</html>
