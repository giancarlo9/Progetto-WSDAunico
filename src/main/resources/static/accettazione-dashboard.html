<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Accettazione</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container-fluid home text-center">
      <h3 id="welcome-message"></h3>
      <img
        src="./assets/logo (1).jpeg"
        alt="logo"
        style="width: 250px; height: auto"
      />
      <h6>Cosa vuoi fare?</h6>
      <div class="row flex-column">
        <button
          onclick="location.href='./accettazione-gestione/registra-cliente.html'"
          class="mt-3 accettazione-button"
        >
          <i class="bi bi-person-fill-add"></i>
          Registra un nuovo cliente
        </button>
        <button
          onclick="location.href='./accettazione-gestione/consulta-clienti.html'"
          class="mt-3 accettazione-button"
        >
          <i class="bi bi-people-fill"></i>
          Consulta i clienti registrati
        </button>
        <button
          onclick="location.href='./accettazione-gestione/registra-veicolo.html'"
          class="mt-3 accettazione-button"
        >
          <i class="bi bi-car-front-fill"></i>
          Registra un nuovo veicolo
        </button>
        <button
          onclick="location.href='./accettazione-gestione/consulta-veicoli.html'"
          class="mt-3 accettazione-button"
        >
          <i class="bi bi-car-front-fill"></i>
          Consulta i veicoli registrati
        </button>
      </div>

      <button
        id="logoutButton"
        class="btn btn-danger mt-3"
        style="border-radius: 10px"
      >
        <i class="bi bi-box-arrow-left me-2"></i>Logout
      </button>
    </div>

    <script src="accettazione-dashboard.js"></script>
  </body>
</html>
